# SPDX-License-Identifier: MIT
#
# Shared toolchain for every CI job: Bun pinned to .tool-versions, Node 24,
# a JDK (build:sdk runs the Java OpenAPI generator), the Bun download cache,
# and a frozen install. Run actions/checkout before this action.
name: setup-toolchain
description: Bun (pinned), Node, JDK, Bun cache and bun install --frozen-lockfile

inputs:
  bun-version:
    description: Bun version; keep equal to .tool-versions
    default: "1.3.13"
  node-version:
    description: Node version for the demo/runtime path
    default: "24"
  java:
    description: Install a JDK (needed by build:sdk's OpenAPI generator)
    default: "true"
  install:
    description: Run bun install --frozen-lockfile
    default: "true"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - if: inputs.java == 'true'
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: "21"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ inputs.bun-version }}-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-${{ inputs.bun-version }}-

    - if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
      env:
        BUN_CONFIG_SKIP_POSTINSTALL_SCRIPTS: "1"
