# SPDX-License-Identifier: MIT
#
# QA gate. Blocks a PR when the code does not typecheck or lint, when a test
# suite fails, or when the built server cannot serve the demo package.
# Repo-agnostic: nothing here names an org, a registry or a secret.
#
# Jobs
#   typecheck-lint  bun run typecheck + bun run lint (+ prettier --check)
#   test            bun run test:sdk + bun run test:server (unit + integration)
#   demo-smoke      bun run build, then .github/ci/smoke.sh boots
#                   packages/server/dist/server.mjs with .github/ci/publisher.config.json
#                   and asserts: PUBLISHER_READY with load_errors=0, status serving
#                   with no loadErrors, the nfl-2024 `season` dashboard is listed,
#                   key_figures answers 285 games / 691 turnovers, and
#                   csv-to-malloy --check compiles against the live model.
#
# Follow-up: once `demo/publisher.config.json` (feature/one-line-demo) is on
# development, point SMOKE_CONFIG at it and retire .github/ci/publisher.config.json.
#
# No Windows leg on purpose: a Windows typecheck needs the full bun install plus
# a JDK, and upstream only makes that fast with the D:-drive + Defender
# workaround in cross-platform-tests.yml. That workflow still runs on PRs.
name: qa

on:
  pull_request:
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-lint:
    name: typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Generate API types
        run: bun run generate-api-types
      # The sdk's .d.ts files are inputs to the app/server typecheck.
      - name: Build sdk
        run: bun run build:sdk
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Prettier
        run: bunx prettier './packages/**/*.{ts,tsx}' --check

  test:
    name: test (sdk + server)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Generate API types
        run: bun run generate-api-types
      - name: Build
        run: bun run build
      - name: SDK tests
        run: bun run test:sdk
      # test:server = test:unit && test:integration, two bun processes on
      # purpose (module mocks leak across files inside one process).
      - name: Server tests (unit + integration)
        run: bun run test:server

  demo-smoke:
    name: demo smoke (nfl-2024)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Generate API types
        run: bun run generate-api-types
      - name: Build
        run: bun run build
      - name: Boot the built server and assert the demo package
        env:
          SMOKE_MODE: boot
          SMOKE_RUNTIME: node
          SMOKE_CONFIG: .github/ci/publisher.config.json
          SMOKE_PORT: "4000"
          SMOKE_MCP_PORT: "4040"
          SMOKE_LOG: ${{ runner.temp }}/publisher-smoke.log
        run: bash .github/ci/smoke.sh
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-smoke-server-log
          path: ${{ runner.temp }}/publisher-smoke.log
          retention-days: 7
